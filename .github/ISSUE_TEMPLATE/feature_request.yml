name: 功能建议
description: 提议新功能或现有功能改进。
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题 / 动机
      description: 这个功能要解决什么问题？它会改善哪个使用场景？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 描述你希望它如何工作，包括入口、交互、配置项或默认行为。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 什么样的结果可以认为这个需求完成了？
      placeholder: |
        - ...
        - ...
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你尝试过哪些替代方案、临时 workaround，或你认为不适合的方案？
    validations:
      required: false
